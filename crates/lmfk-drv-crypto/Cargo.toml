[package]
name = "lmfk-drv-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Integrity and authenticity verification for LMFK .drv packages"

[dependencies]
lmfk-drv-format = { path = "../lmfk-drv-format" }
lmfk-drv-parser = { path = "../lmfk-drv-parser" }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
