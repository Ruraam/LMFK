[package]
name = "drvpack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Build and sign LMFK .drv packages"

[dependencies]
lmfk-drv-format = { path = "../../crates/lmfk-drv-format" }
lmfk-drv-crypto = { path = "../../crates/lmfk-drv-crypto" }
ed25519-dalek = { version = "2", features = ["std"] }
sha2 = "0.10"
